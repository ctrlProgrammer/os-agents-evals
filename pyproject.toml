[project]
name = "os-agents-evals"
version = "0.1.0"
description = "CLI that runs one prompt set against several LLMs and compares accuracy, cost and latency"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
os-evals = "os_agents_evals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
